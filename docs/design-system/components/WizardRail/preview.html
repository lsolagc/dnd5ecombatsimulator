<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>WizardRail</title></head>
<body>
<div class="wizard">
  <aside class="wizard-rail">
    <h2>Novo personagem</h2>
    <ol class="list-group">
      <li class="list-group-item active" aria-current="step">1. Atributos</li>
      <li class="list-group-item">2. Combate</li>
      <li class="list-group-item">3. Features</li>
      <li class="list-group-item">4. Revisão</li>
    </ol>
    <div class="wizard-summary"><div class="text-secondary">RESUMO</div><strong>Sem nome</strong><div class="text-secondary">Sem classe · nível 1</div><div>HP — · CA 10 · 1 ataque(s)</div></div>
  </aside>
  <div class="wizard-body">
    <h2 style="font-size:1.25rem;font-weight:700;margin:0">Atributos</h2>
    <p class="text-secondary small">Copie os valores da ficha do jogador.</p>
    <div class="wizard-foot"><span class="text-secondary">3 de 4 etapas restantes</span><button class="btn btn-outline-secondary">← Voltar</button><button class="btn btn-primary">Continuar</button></div>
  </div>
</div>
<script>/* static preview */</script>
</body>
</html>
