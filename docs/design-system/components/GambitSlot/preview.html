<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>GambitSlot</title></head>
<body>
<div class="gambit-list">
  <div class="gambit-slot">
    <span class="gambit-slot__handle" aria-hidden="true">⠿</span><span class="gambit-slot__num">2</span>
    <button class="btn btn-sm btn-success">● Ligado</button>
    <div class="gambit-slot__field"><label>Alvo</label><select class="form-select form-select-sm"><option>Inimigo</option></select></div>
    <div class="gambit-slot__field"><label>Condição</label><select class="form-select form-select-sm"><option>Recurso no mínimo</option></select></div>
    <div class="gambit-slot__field"><label>Valor</label><input class="form-control form-control-sm" value="2" style="width:5rem"></div>
    <div class="gambit-slot__field"><label>Ação</label><select class="form-select form-select-sm"><option>Maneuver: Precision Attack</option></select></div>
    <button class="btn btn-sm btn-primary">Salvar</button>
    <div class="gambit-slot__actions"><button class="btn btn-sm btn-outline-secondary" aria-label="Subir">↑</button><button class="btn btn-sm btn-outline-secondary" aria-label="Descer">↓</button><button class="btn btn-sm btn-outline-danger">Remover</button></div>
  </div>
  <div class="gambit-slot is-off">
    <span class="gambit-slot__handle" aria-hidden="true">⠿</span><span class="gambit-slot__num">5</span>
    <button class="btn btn-sm btn-outline-secondary">○ Desligado</button>
    <div class="gambit-slot__field"><label>Alvo</label><select class="form-select form-select-sm"><option>Inimigo</option></select></div>
    <div class="gambit-slot__field"><label>Condição</label><select class="form-select form-select-sm"><option>Não marcado</option></select></div>
    <div class="gambit-slot__field"><label>Ação</label><select class="form-select form-select-sm"><option>Maneuver: Distracting Strike</option></select></div>
    <button class="btn btn-sm btn-primary" disabled>Salvar</button>
    <div class="gambit-slot__actions"><button class="btn btn-sm btn-outline-secondary">↑</button><button class="btn btn-sm btn-outline-secondary">↓</button><button class="btn btn-sm btn-outline-danger">Remover</button></div>
  </div>
</div>
<script>/* static preview */</script>
</body>
</html>
