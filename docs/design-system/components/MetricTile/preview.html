<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>MetricTile</title></head>
<body>
<div class="sim-tiles">
  <div class="sim-tile"><div class="sim-tile__label">Cura realizada</div><div class="sim-tile__value">441</div><p class="sim-tile__hint">HP efetivamente recuperado</p></div>
  <div class="sim-tile"><div class="sim-tile__label">Cura desperdiçada</div><div class="sim-tile__value">0</div><p class="sim-tile__hint">0,0% da cura rolada passou do HP máximo</p></div>
  <div class="sim-tile"><div class="sim-tile__label">Maior dano em um round</div><div class="sim-tile__value">43</div><p class="sim-tile__hint">soma de todos os combatentes</p></div>
  <div class="sim-tile"><div class="sim-tile__label">Tempo médio</div><div class="sim-tile__value">82 ms</div><p class="sim-tile__hint">por simulação</p></div>
</div>
<script>/* static preview */</script>
</body>
</html>
