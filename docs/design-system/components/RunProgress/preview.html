<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>RunProgress</title></head>
<body>
<section class="sim-panel" aria-live="polite">
  <p class="sim-eyebrow">Rodando</p>
  <div class="sim-progress-head">
    <div><span class="sim-hero">37</span> <span class="sim-hero__total">/ 100 simulações finalizadas</span></div>
    <dl class="sim-progress-stats"><div><dt>Tempo médio</dt><dd>40 ms</dd></div><div><dt>Ritmo</dt><dd>24/s</dd></div><div><dt>Restante</dt><dd>3 s</dd></div></dl>
  </div>
  <div class="progress" role="progressbar" aria-valuenow="37" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar progress-bar-striped" style="width:37%"></div></div>
  <button class="btn btn-outline-danger">Interromper</button>
</section>
<script>/* static preview */</script>
</body>
</html>
