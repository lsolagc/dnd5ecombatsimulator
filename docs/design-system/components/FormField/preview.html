<html lang="pt-BR">
<head><meta charset="utf-8"><title>FormField</title></head>
<body>
<div class="grid-2" style="max-width:40rem">
  <div>
    <label class="form-label fw-bold" for="n">Simulações</label>
    <input class="form-control" id="n" type="number" value="100">
    <div class="form-text">De 1 a 1000.</div>
  </div>
  <div>
    <label class="form-label fw-bold" for="s">Seed (opcional)</label>
    <input class="form-control font-monospace" id="s" placeholder="aleatória">
    <div class="form-text">Fixa as rolagens e roda uma única simulação.</div>
  </div>
</div>
<script>/* static preview */</script>
</body>
</html>
