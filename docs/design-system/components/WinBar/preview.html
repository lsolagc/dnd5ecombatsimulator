<!-- @dsCard group="Simulações" height=210 -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>WinBar</title></head>
<body>
<section class="sim-panel">
  <p class="sim-eyebrow">Resultado · 50 simulações</p>
  <h2 class="sim-headline"><span class="sim-dot sim-dot--party_two" aria-hidden="true"></span>Lado B venceu 58,0% dos combates.</h2>
  <div class="sim-winbar" role="img" aria-label="Lado A 42,0%, sem vencedor 0,0%, Lado B 58,0%">
    <div class="sim-winbar__segment sim-winbar__segment--party_one" style="flex:42">42,0%</div>
    <div class="sim-winbar__segment sim-winbar__segment--party_two" style="flex:58">58,0%</div>
  </div>
  <dl class="sim-legend">
    <div><dt><span class="sim-dot sim-dot--party_one"></span>Vitórias do lado A</dt><dd><strong>42,0%</strong> 21 de 50</dd></div>
    <div><dt><span class="sim-dot sim-dot--none"></span>Sem vencedor</dt><dd><strong>0,0%</strong> 0 de 50 · empate ou limite de rodadas</dd></div>
    <div><dt><span class="sim-dot sim-dot--party_two"></span>Vitórias do lado B</dt><dd><strong>58,0%</strong> 29 de 50</dd></div>
  </dl>
</section>
<script>/* static preview */</script>
</body>
</html>
