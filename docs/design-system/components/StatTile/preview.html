<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>StatTile</title></head>
<body>
<div class="stack">
  <div class="stat-grid">
    <div class="stat-tile"><div class="stat-tile__label">HP máx.</div><div class="stat-tile__value">36</div></div>
    <div class="stat-tile"><div class="stat-tile__label">CA</div><div class="stat-tile__value">18</div></div>
    <div class="stat-tile"><div class="stat-tile__label">Deslocamento</div><div class="stat-tile__value">30 ft</div></div>
    <div class="stat-tile"><div class="stat-tile__label">Bônus prof.</div><div class="stat-tile__value">+2</div></div>
  </div>
  <div class="stat-grid">
    <div class="stat-tile stat-tile--attr"><div class="stat-tile__label">Força</div><div class="stat-tile__value">18</div><div class="stat-tile__mod">MOD +4</div></div>
    <div class="stat-tile stat-tile--attr"><div class="stat-tile__label">Destreza</div><div class="stat-tile__value">14</div><div class="stat-tile__mod">MOD +2</div></div>
    <div class="stat-tile stat-tile--attr"><div class="stat-tile__label">Carisma</div><div class="stat-tile__value">8</div><div class="stat-tile__mod">MOD -1</div></div>
  </div>
</div>
<script>/* static preview */</script>
</body>
</html>
