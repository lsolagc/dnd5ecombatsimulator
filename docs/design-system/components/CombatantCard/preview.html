<!-- @dsCard group="Simulações" height=300 -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>CombatantCard</title></head>
<body>
<div class="sim-side sim-side--party_one" style="max-width:46rem">
  <div class="sim-side__list">
    <article class="sim-card">
      <div class="sim-card__header">
        <div><h3 class="sim-card__name">Corwin Vale</h3><p class="sim-card__meta">Guerreiro · nível 4 · HP máx. 36</p></div>
        <div class="sim-card__actions"><span class="sim-card__edits">2 ajustes</span><button class="btn btn-link sim-card__reset">Restaurar ficha</button><button class="sim-card__close" aria-label="Remover">×</button></div>
      </div>
      <div class="sim-card__stats">
        <div class="sim-field is-edited"><label>HP inicial</label><div class="input-group"><input class="form-control form-control-sm font-monospace" value="20"><span class="input-group-text">/36</span></div></div>
        <div class="sim-field"><label>CA</label><input class="form-control form-control-sm font-monospace" value="18"></div>
        <div class="sim-field"><label>Ataque</label><input class="form-control form-control-sm font-monospace" value="6"></div>
        <div class="sim-field is-edited"><label>Dano</label><input class="form-control form-control-sm font-monospace" value="2d6"></div>
        <div class="sim-field"><label>Tipo de dano</label><select class="form-select form-select-sm"><option>Cortante</option></select></div>
      </div>
      <details class="sim-card__defenses"><summary><span class="sim-card__defenses-title">Defesas</span><span class="sim-card__defenses-summary">nenhuma</span></summary></details>
      <div class="sim-card__gambits"><span class="sim-card__defenses-title">Gambits</span> <span class="text-secondary">1. Self: qualquer → Action Surge · 2. Inimigo: recurso ≥ 2 → Precision Attack</span> · <a href="#">Editar gambits</a></div>
    </article>
  </div>
</div>
<script>/* static preview */</script>
</body>
</html>
