<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>SidePanel</title></head>
<body>
<div class="grid-2">
  <section class="sim-side sim-side--party_one">
    <header class="sim-side__header"><span class="sim-side__badge" aria-hidden="true">A</span><h2 class="sim-side__title">Lado A</h2><span class="sim-side__count">1 combatente</span></header>
    <ul class="sim-roster"><li class="sim-roster__item"><div class="sim-roster__head"><strong>Brenna Ironhide</strong><span>Guerreiro · nível 4</span></div><p class="sim-roster__stats">HP 40/40 · CA 18 · +6 · 2d6 cortante</p></li></ul>
  </section>
  <section class="sim-side sim-side--party_two">
    <header class="sim-side__header"><span class="sim-side__badge" aria-hidden="true">B</span><h2 class="sim-side__title">Lado B</h2><span class="sim-side__count">0 combatentes</span></header>
    <p class="sim-side__empty">Nenhum combatente ainda. Escolha abaixo quem entra no Lado B.</p>
    <select class="form-select sim-side__picker"><option>+ Adicionar personagem…</option></select>
  </section>
</div>
<script>/* static preview */</script>
</body>
</html>
