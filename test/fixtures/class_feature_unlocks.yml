second_wind_level_1:
  class_feature: fighter_second_wind
  level: 1
  uses: 1
  resource_name: Second Wind
  description: Regain 1d10 + fighter level hit points.
  effect_payload:
    kind: heal
    roll: "1d10 + actor_level"
    target: self

action_surge_level_2:
  class_feature: fighter_action_surge
  level: 2
  uses: 1
  action_type: no_action
  recharge_type: short_or_long_rest
  description: Gain one additional action on your turn.

action_surge_level_17:
  class_feature: fighter_action_surge
  level: 17
  uses: 2
  action_type: no_action
  recharge_type: short_or_long_rest
  description: You can use Action Surge twice between rests, but only once on the same turn.

indomitable_level_9:
  class_feature: fighter_indomitable
  level: 9
  uses: 1
  description: Reroll a failed save; must use the new result.

indomitable_level_13:
  class_feature: fighter_indomitable
  level: 13
  uses: 2
  description: Usable twice between long rests.

indomitable_level_17:
  class_feature: fighter_indomitable
  level: 17
  uses: 3
  description: Usable three times between long rests.

fighting_style_archery_level_1:
  class_feature: fighter_fighting_style_archery
  level: 1
  description: Gain +2 to attack rolls made with ranged weapons.
  effect_payload:
    kind: modifier
    trigger: always
    modifier: attack_bonus
    value: 2

fighting_style_defense_level_1:
  class_feature: fighter_fighting_style_defense
  level: 1
  description: Gain +1 to Armor Class while wearing armor.
  effect_payload:
    kind: modifier
    trigger: always
    modifier: armor_class
    value: 1

fighting_style_dueling_level_1:
  class_feature: fighter_fighting_style_dueling
  level: 1
  description: Gain +2 to damage rolls while wielding a one-handed melee weapon and no other weapon.
  effect_payload:
    kind: modifier
    trigger: always
    modifier: damage_bonus
    value: 2

champion_archetype_level_3:
  class_feature: fighter_champion_archetype
  level: 3
  description: Select Champion as your martial archetype.

champion_improved_critical_level_3:
  class_feature: fighter_champion_improved_critical
  level: 3
  description: Weapon attacks now crit on 19-20.
  effect_payload:
    kind: modifier
    trigger: always
    modifier: critical_hit_threshold
    value: 19

champion_remarkable_athlete_level_7:
  class_feature: fighter_champion_remarkable_athlete
  level: 7
  description: Gain half proficiency on non-proficient STR/DEX/CON checks and improve long jump.

champion_additional_fighting_style_level_10:
  class_feature: fighter_champion_additional_fighting_style
  level: 10
  description: Choose one additional Fighting Style.

champion_superior_critical_level_15:
  class_feature: fighter_champion_superior_critical
  level: 15
  description: Weapon attacks now crit on 18-20.
  effect_payload:
    kind: modifier
    trigger: always
    modifier: critical_hit_threshold
    value: 18

champion_survivor_level_18:
  class_feature: fighter_champion_survivor
  level: 18
  description: Regain 5 + CON modifier HP at turn start while below half HP and above 0 HP.
  effect_payload:
    kind: heal
    trigger: turn_start
    roll: "5 + constitution_modifier"
    target: self
    conditions:
      current_hp_gt: 0
      current_hp_lte_max_hp_fraction: 0.5

battle_master_archetype_level_3:
  class_feature: fighter_battle_master_archetype
  level: 3
  description: Select Battle Master as your martial archetype.

battle_master_combat_superiority_level_3:
  class_feature: fighter_battle_master_combat_superiority
  level: 3
  uses: 4
  description: Gain superiority dice and learn three maneuvers.

battle_master_maneuver_precision_attack_level_3:
  class_feature: fighter_battle_master_maneuver_precision_attack
  level: 3
  description: Maneuver available for the Battle Master to choose.
  effect_payload:
    kind: damage
    roll: "1d8"
    target: enemy
    damage_type: bludgeoning
    applies_to: weapon_attack

eldritch_knight_archetype_level_3:
  class_feature: fighter_eldritch_knight_archetype
  level: 3
  description: Select Eldritch Knight as your martial archetype.

eldritch_knight_spellcasting_level_3:
  class_feature: fighter_eldritch_knight_spellcasting
  level: 3
  description: Learn wizard cantrips and spells.

eldritch_knight_war_magic_level_7:
  class_feature: fighter_eldritch_knight_war_magic
  level: 7
  description: Casting a cantrip as your action lets you make a weapon attack as a bonus action.

eldritch_knight_eldritch_strike_level_10:
  class_feature: fighter_eldritch_knight_eldritch_strike
  level: 10
  description: A weapon attack imposes disadvantage on the target's next save against your spells.

eldritch_knight_improved_war_magic_level_18:
  class_feature: fighter_eldritch_knight_improved_war_magic
  level: 18
  description: Casting any spell as your action lets you make a weapon attack as a bonus action.

# Test-only: see barbarian_test_save_strike in class_features.yml.
test_save_strike_level_1:
  class_feature: barbarian_test_save_strike
  level: 1
  description: Test fixture damage effect with a saving throw.
  effect_payload:
    kind: damage
    roll: "1d6"
    target: enemy
    damage_type: bludgeoning
    save:
      ability: constitution
      dc: 8
      on_success: half

wizard_spellcasting_level_1:
  class_feature: wizard_spellcasting
  level: 1
  uses_formula: spell_slots_table
  description: Wizard gains access to cantrips and 1st-level spell slots by class progression.