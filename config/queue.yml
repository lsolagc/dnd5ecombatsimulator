default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  # Simulations are CPU-bound Ruby: parallelism comes from processes (the GVL serializes threads).
  workers:
    - queues: "*"
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY") { [ Etc.nprocessors / 2, 1 ].max } %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
